[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-flows"
version = "0.1.0"
description = "GitHub lifecycle and review gates for cloud-agent workflows"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-flows = "ai_flows.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_flows*"]
